name: Build & Push Docker Image to AWS ECR
on:
  push:
    branches:
      - develop
      - main
      - docker-push # temporary for testing
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  publish-image:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    env:
      AWS_ACCOUNT_ID: ${{ github.ref == 'refs/heads/main' && '107277382008' || '485262375119' }}
      AWS_REGION: eu-central-1
      ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      IMAGE_NAME: aa-runner
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set derived environment variables
        run: |
          echo "ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/gh-oidc-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}
      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$IMAGE_NAME" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$IMAGE_NAME" --image-tag-mutability MUTABLE
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.ENVIRONMENT }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Image details
        run: |
          echo "🐳 Docker image pushed successfully!"
          echo "📦 Repository: ${ECR_REGISTRY}/${IMAGE_NAME}"
          echo "🏷️  Tags:"
          echo "   - ${GITHUB_SHA}"
          echo "   - ${GITHUB_REF_NAME}"
          echo "   - ${ENVIRONMENT}"
          echo "   - latest"